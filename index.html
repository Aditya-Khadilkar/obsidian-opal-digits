<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!-- Added to the home screen, iOS opens this without browser chrome, which
         is the only route to fullscreen there: iPhone Safari has no Fullscreen
         API for ordinary elements. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Opal Digits" />
    <title>Obsidian Opal Digits</title>
    <meta
      name="description"
      content="A real-time WebGL material: black volcanic glass with diffractive seven-segment digits at several depths."
    />
    <link rel="icon" href="data:," />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      body {
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #9aa7a6;
        -webkit-text-size-adjust: 100%;
      }
      #app { position: fixed; inset: 0; touch-action: none; }
      #app > canvas { display: block; width: 100%; height: 100%; }
      .stats {
        position: fixed;
        left: max(10px, env(safe-area-inset-left));
        bottom: max(10px, env(safe-area-inset-bottom));
        padding: 4px 8px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.45);
        color: #7fd8c9;
        pointer-events: none;
        white-space: nowrap;
      }
      body.nogui .stats { display: none; }

      .fullscreen-toggle {
        position: fixed;
        right: max(10px, env(safe-area-inset-right));
        bottom: max(10px, env(safe-area-inset-bottom));
        width: 38px;
        height: 38px;
        font: inherit;
        font-size: 17px;
        line-height: 1;
        color: #7fd8c9;
        border-radius: 9px;
        border: 1px solid rgba(127, 216, 201, 0.25);
        background: rgba(0, 0, 0, 0.45);
        cursor: pointer;
        z-index: 25;
        -webkit-tap-highlight-color: transparent;
      }
      .fullscreen-toggle:hover { border-color: rgba(127, 216, 201, 0.6); }
      .tp-dfwv { z-index: 10; width: 280px; }

      .tilt-debug {
        position: fixed;
        left: max(10px, env(safe-area-inset-left));
        top: max(10px, env(safe-area-inset-top));
        padding: 8px 10px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.6);
        color: #7fd8c9;
        white-space: pre;
        pointer-events: none;
        z-index: 20;
      }

      .start-overlay {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: rgba(0, 0, 0, 0.55);
        transition: opacity 380ms ease;
      }
      .start-overlay.is-hidden { opacity: 0; pointer-events: none; }
      .start-button {
        font: inherit;
        font-size: 15px;
        letter-spacing: 0.04em;
        color: #cfeee7;
        padding: 14px 28px;
        border-radius: 999px;
        border: 1px solid rgba(127, 216, 201, 0.5);
        background: rgba(10, 26, 24, 0.75);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .start-button:hover { border-color: rgba(127, 216, 201, 0.9); }
      .start-button:disabled { opacity: 0.5; cursor: default; }
      .start-hint { margin: 0; color: #6f8a86; }

      .toast {
        position: fixed;
        left: 50%;
        bottom: max(28px, env(safe-area-inset-bottom));
        transform: translate(-50%, 12px);
        padding: 10px 16px;
        border-radius: 6px;
        background: rgba(12, 30, 28, 0.92);
        color: #cfeee7;
        opacity: 0;
        transition: opacity 320ms ease, transform 320ms ease;
        pointer-events: none;
        z-index: 40;
      }
      .toast.is-visible { opacity: 1; transform: translate(-50%, 0); }

      @media (prefers-reduced-motion: reduce) {
        .start-overlay, .toast { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
